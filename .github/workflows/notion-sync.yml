name: Notion Task Sync
on: [push]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Sync Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python -c "
          import os, re, json, urllib.request

          commit_msg = os.popen('git log -1 --pretty=%B').read().strip()
          match = re.search(r'TLS-(\d+)', commit_msg)
          if not match:
              print('No task ID found in commit message.')
              exit(0)

          task_num = int(match.group(1))
          print(f'Found Task ID: TLS-{task_num}')

          token = os.environ['NOTION_TOKEN']
          db_id = os.environ['NOTION_DATABASE_ID']

          query_url = f'https://api.notion.com/v1/databases/{db_id}/query'
          query_data = json.dumps({
              'filter': {
                  'property': 'ID',
                  'unique_id': {'equals': task_num}
              }
          }).encode('utf-8')

          req = urllib.request.Request(query_url, data=query_data, headers={
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json'
          }, method='POST')

          try:
              with urllib.request.urlopen(req) as response:
                  res_data = json.loads(response.read().decode())
                  results = res_data.get('results', [])
                  if not results:
                      print('No matching page found in Notion.')
                      exit(0)
                  page_id = results[0]['id']
          except Exception as e:
              print(f'Error querying database: {e}')
              exit(1)

          update_url = f'https://api.notion.com/v1/pages/{page_id}'
          update_data = json.dumps({
              'properties': {
                  'Status': {
                      'status': {'name': 'Done'}
                  }
              }
          }).encode('utf-8')

          req_update = urllib.request.Request(update_url, data=update_data, headers={
              'Authorization': f'Bearer {token}',
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json'
          }, method='PATCH')

          try:
              with urllib.request.urlopen(req_update) as response:
                  print('Task status successfully updated to Done.')
          except Exception as e:
              print(f'Error updating page status: {e}')
              exit(1)
          "